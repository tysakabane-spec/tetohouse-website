<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>TETO HOUSE 写真管理</title>
<style>
:root{font-family:system-ui,-apple-system,"Segoe UI",sans-serif;color:#1b1b1b;background:#f5f5f3}*{box-sizing:border-box}body{margin:0}.wrap{max-width:1180px;margin:auto;padding:28px 22px 60px}header{display:flex;justify-content:space-between;gap:20px;align-items:center;margin-bottom:24px}header>div:first-child{min-width:0}h1{font-size:28px;margin:0 0 6px}p{margin:0;color:#666;line-height:1.55}.toolbar{display:flex;gap:10px;flex-wrap:wrap;flex:0 0 auto}.btn{border:1px solid #ccc;background:white;border-radius:9px;padding:10px 14px;font-weight:700;cursor:pointer}.btn.primary{background:#171717;color:white;border-color:#171717}.drop{display:flex;width:100%;min-height:118px;flex-direction:column;align-items:center;justify-content:center;gap:4px;border:2px dashed #aaa;border-radius:14px;background:white;padding:24px 28px;text-align:center;margin:0 0 18px;line-height:1.45;transition:.15s;cursor:pointer}.drop.drag{border-color:#111;background:#eee}.drop strong{display:block;font-size:17px;margin:0}.drop span{display:block;max-width:760px}.drop input{display:none}.status{min-height:24px;margin:8px 0 14px;font-size:14px}.status.ok{color:#176b2f}.status.err{color:#b00020}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:14px}.card{position:relative;background:white;border:1px solid #ddd;border-radius:12px;overflow:hidden;cursor:grab;box-shadow:0 1px 2px #0001}.card.dragging{opacity:.4}.card img{width:100%;aspect-ratio:4/3;object-fit:cover;display:block}.meta{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:9px 10px}.num{font-weight:800;font-size:13px}.name{font-size:11px;color:#777;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:105px}.delete{position:absolute;top:7px;right:7px;border:0;border-radius:999px;width:30px;height:30px;background:#fff;color:#a00;font-weight:900;cursor:pointer;box-shadow:0 1px 4px #0003}.hint{margin-top:18px;font-size:13px;color:#666}.busy{pointer-events:none;opacity:.65}@media(max-width:650px){.wrap{padding:20px 16px 44px}header{align-items:stretch;flex-direction:column;margin-bottom:18px}.toolbar{width:100%}.toolbar .btn{flex:1 1 auto}.drop{min-height:132px;padding:22px 18px}.grid{grid-template-columns:repeat(2,1fr)}}
</style>
</head>
<body><div class="wrap">
<header><div><h1>TETO HOUSE 写真管理</h1><p>写真をドラッグして順番変更。追加・削除後はGitHub DesktopでCommit → Pushします。</p></div><div class="toolbar"><button class="btn" id="preview">公開ページを確認</button><button class="btn primary" id="save">順番を保存</button></div></header>
<label class="drop" id="drop"><strong>ここに室内写真をドラッグ＆ドロップ</strong><span>またはクリックして選択。JPEG / PNG / WebPなど → 自動でWebP化・最大1600pxに縮小</span><input id="picker" type="file" accept="image/*" multiple></label>
<div class="status" id="status"></div><div class="grid" id="grid"></div>
<p class="hint">※ 「削除」は室内写真ギャラリーから外します。元画像ファイルは、設備・比較セクションで使われている可能性があるため安全のため残します。</p>
</div>
<script>
const grid=document.getElementById('grid'),drop=document.getElementById('drop'),picker=document.getElementById('picker'),statusEl=document.getElementById('status'),saveBtn=document.getElementById('save');
let items=[],dragged=null,dirty=false;
function status(msg,type=''){statusEl.textContent=msg;statusEl.className='status '+type}
function render(){grid.innerHTML='';items.forEach((item,i)=>{const card=document.createElement('article');card.className='card';card.draggable=true;card.dataset.file=item.file;card.innerHTML=`<button class="delete" title="削除" aria-label="削除">×</button><img src="/assets/thumbs/${encodeURIComponent(item.thumb||item.file)}?v=${Date.now()}" alt="室内写真 ${i+1}"><div class="meta"><span class="num">${i+1}</span><span class="name" title="${item.file}">${item.file}</span></div>`;card.addEventListener('dragstart',()=>{dragged=card;card.classList.add('dragging')});card.addEventListener('dragend',()=>{card.classList.remove('dragging');dragged=null;syncOrder();dirty=true;status('並び順を変更しました。「順番を保存」を押してください。')});card.addEventListener('dragover',e=>{e.preventDefault();if(!dragged||dragged===card)return;const cards=[...grid.children],from=cards.indexOf(dragged),to=cards.indexOf(card);grid.insertBefore(dragged,from<to?card.nextSibling:card)});card.querySelector('.delete').addEventListener('click',()=>removeItem(item));grid.appendChild(card)})}
function syncOrder(){const order=[...grid.children].map(c=>c.dataset.file);items=order.map(f=>items.find(x=>x.file===f)).filter(Boolean);render()}
async function load(){const r=await fetch('/api/gallery');items=await r.json();render();status(`${items.length}枚の室内写真を読み込みました。`,'ok')}
async function uploadFiles(files){for(const f of files){if(!f.type.startsWith('image/'))continue;status(`${f.name} を処理しています…`);drop.classList.add('busy');try{const r=await fetch('/api/upload',{method:'POST',headers:{'Content-Type':f.type||'application/octet-stream','X-Filename':encodeURIComponent(f.name)},body:f});const data=await r.json();if(!r.ok||!data.ok)throw new Error(data.error||'アップロードに失敗しました');items.push(data.item);render();status(`${f.name} を追加しました。`,'ok')}catch(e){status(e.message,'err');break}finally{drop.classList.remove('busy')}}}
async function removeItem(item){if(!confirm(`この写真を削除しますか？\n${item.file}`))return;const r=await fetch('/api/delete',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({file:item.file})});const data=await r.json();if(!r.ok||!data.ok){status(data.error||'削除に失敗しました','err');return}items=items.filter(x=>x.file!==item.file);render();status('室内写真ギャラリーから外しました。元画像ファイルは安全のため残しています。','ok')}
saveBtn.addEventListener('click',async()=>{const files=items.map(x=>x.file);const r=await fetch('/api/order',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({files})});const data=await r.json();if(!r.ok||!data.ok){status(data.error||'保存に失敗しました','err');return}dirty=false;status('並び順を gallery.json に保存しました。次にGitHub DesktopでCommit → Pushしてください。','ok')});
drop.addEventListener('click',()=>picker.click());picker.addEventListener('change',()=>uploadFiles([...picker.files]));['dragenter','dragover'].forEach(ev=>drop.addEventListener(ev,e=>{e.preventDefault();drop.classList.add('drag')}));['dragleave','drop'].forEach(ev=>drop.addEventListener(ev,e=>{e.preventDefault();drop.classList.remove('drag')}));drop.addEventListener('drop',e=>uploadFiles([...e.dataTransfer.files]));document.getElementById('preview').addEventListener('click',()=>window.open('/preview','_blank'));window.addEventListener('beforeunload',e=>{if(dirty){e.preventDefault();e.returnValue=''}});load();
</script></body></html>
